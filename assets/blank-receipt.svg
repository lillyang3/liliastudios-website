    <!-- The middle length bends back across the page. -->
    <path d="M472 325 C531 355 565 425 536 502 C505 584 371 619 267 679 C219 707 221 753 268 778 L468 823 C374 820 219 812 177 761 C123 697 157 629 218 581 C318 502 431 475 472 325Z" fill="url(#turn)"/>
    <!-- Long front face unwinds into the lower loop. -->
    <path d="M267 679 C216 709 223 750 268 778 C330 817 452 801 508 861 C571 929 520 1025 441 1087 L271 1219 L94 1147 C141 1082 219 1022 272 975 C337 917 322 881 268 854 C178 809 145 745 177 698 C193 675 230 670 267 679Z" fill="url(#paper)"/>
