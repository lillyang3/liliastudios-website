  <g filter="url(#shadow)">
    <!-- Back of the first loose curl. -->
    <path d="M230 40 L445 65 C417 185 285 285 209 360 C162 406 180 445 238 453 L444 485 C310 493 136 456 130 389 C123 304 208 185 230 40Z" fill="url(#fold)"/>
    <!-- Front face rolls diagonally into the first bend. -->
