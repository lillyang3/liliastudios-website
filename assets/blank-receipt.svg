    <path d="M94 1147 L271 1219 L285 1240 L110 1173Z" fill="#d2d1cd"/>
  </g>
  <path d="M234 44 L440 68" stroke="#fff" stroke-opacity=".7"/>
  <path d="M98 1147 L271 1219" stroke="#cecdc8" stroke-width="1"/>
