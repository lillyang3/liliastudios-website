<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1280" fill="none">
  <defs>
    <linearGradient id="paper" x1="180" y1="0" x2="490" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#e6e5e1"/><stop offset=".23" stop-color="#fcfbf8"/><stop offset=".7" stop-color="#f6f5f1"/><stop offset="1" stop-color="#d9d8d4"/></linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c5c4c0"/><stop offset=".48" stop-color="#eeeDE9"/><stop offset="1" stop-color="#faf9f5"/></linearGradient>
    <linearGradient id="turn" x1="150" y1="650" x2="520" y2="900" gradientUnits="userSpaceOnUse"><stop stop-color="#faf9f5"/><stop offset=".5" stop-color="#e7e6e2"/><stop offset="1" stop-color="#bebdb9"/></linearGradient>
    <filter id="shadow" x="-35%" y="-15%" width="170%" height="145%"><feDropShadow dx="7" dy="15" stdDeviation="12" flood-color="#000" flood-opacity=".13"/></filter>
